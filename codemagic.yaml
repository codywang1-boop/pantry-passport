workflows:
  ios-unsigned:
    name: Pantry Passport iOS (unsigned .ipa for Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install packages
        script: npm install
      - name: Add iOS platform
        script: npx cap add ios
      - name: App icon and splash
        script: |
          node make-icons.js
          npx @capacitor/assets generate --ios --iconBackgroundColor '#5b4bff' --splashBackgroundColor '#5b4bff'
      - name: Sync web app into iOS
        script: npx cap sync ios
      - name: Camera and photo permissions
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take photos of your ingredients or a recipe so Pantry Passport can read them.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Pick photos of your ingredients, recipes or dishes.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" $PLIST || true
      - name: Build unsigned app
        script: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath $CM_BUILD_DIR/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        script: |
          APP=$(find $CM_BUILD_DIR/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p $CM_BUILD_DIR/Payload && cp -R "$APP" $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR && zip -qr PantryPassport-unsigned.ipa Payload
    artifacts:
      - PantryPassport-unsigned.ipa
